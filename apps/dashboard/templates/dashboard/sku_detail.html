{% extends "dashboard/base.html" %}
{% load humanize static %}

{% block content %}

<!-- SKU Selector -->
<div class="sku-hero">
    <div class="sku-hero-left">
        <h1>Dashboard Keputusan</h1>
        <div class="sku-hero-meta">
            <a href="{% url 'dashboard:summary' %}">← Ringkasan semua SKU</a>
            <span>·</span>
            <a href="{% url 'dashboard:sku_history' sku.sku_id %}">Riwayat keputusan →</a>
        </div>
    </div>
    <div class="sku-select-wrapper">
        <select id="sku-select" class="sku-select" name="sku"
                hx-get="{% url 'dashboard:dashboard_partial' %}"
                hx-target="#dashboard-content"
                hx-swap="innerHTML"
                hx-trigger="change"
                hx-indicator="#loading-spinner">
            {% for s in skus %}
            <option value="{{ s.sku_id }}" {% if s.sku_id == selected_sku_id %}selected{% endif %}>
                {{ s.sku_id }} — {{ s.name }}
            </option>
            {% endfor %}
        </select>
    </div>
</div>

<!-- Loading -->
<div id="loading-spinner" class="htmx-indicator" style="text-align:center;padding:40px 0;">
    <div class="loading-spinner" style="margin:0 auto;"></div>
    <div style="margin-top:12px;color:var(--ram-muted-500);font-size:13px;">Menghitung ulang...</div>
</div>

<!-- Swappable content -->
<div id="dashboard-content">
    {% include "dashboard/_partials/dashboard_content.html" %}
</div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'dashboard/js/charts.js' %}"></script>
{% endblock %}
